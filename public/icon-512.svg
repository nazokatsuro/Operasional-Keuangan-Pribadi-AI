<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafaff" />
      <stop offset="100%" stop-color="#b583ff" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c5cff" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Elegant concentric grid rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="10 15" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#9d4edd" stroke-width="1.0" stroke-opacity="0.1" />
  <!-- Center letter N with Drop shadow glow -->
  <g filter="url(#glow)">
    <!-- Column 1 (Left vertical stem) -->
    <path d="M 145,130 C 145,118.95 153.95,110 165,110 L 205,110 C 216.05,110 225,118.95 225,130 L 225,382 C 225,393.05 216.05,402 205,402 L 165,402 C 153.95,402 145,393.05 145,382 Z" fill="url(#primaryGrad)" />
    <!-- Column 2 (Right vertical stem) -->
    <path d="M 287,130 C 287,118.95 295.95,110 307,110 L 347,110 C 358.05,110 367,118.95 367,130 L 367,382 C 367,393.05 358.05,402 347,402 L 307,402 C 295.95,402 287,393.05 287,382 Z" fill="url(#primaryGrad)" opacity="0.95" />
    <!-- Diagonal crossbeam overlaps stems seamlessly -->
    <path d="M 197,135 L 315,377 C 322,389 337,384 337,370 L 337,210 C 337,199 328,190 317,190 L 315,190 C 304,190 295,181 295,170 C 295,159 304,150 315,150 L 338,150 C 350,150 360,160 360,172 L 360,350 C 360,374 333,388 314,374 L 196,132 C 189,120 174,125 174,139 L 174,310 C 174,321 183,330 194,330 L 196,330 C 207,330 216,339 216,350 C 216,361 207,370 196,370 L 173,370 C 161,370 151,360 151,348 L 151,170 C 151,146 178,132 197,135 Z" fill="url(#accentGrad)" />
  </g>
</svg>
